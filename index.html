<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ISP Assets Manager - تسجيل الدخول</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-header">

                <div class="logo">
                    ISP
                </div>

                <h1>ISP Assets Manager</h1>

                <p>نظام إدارة أصول الشبكة</p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="أدخل البريد الإلكتروني"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div id="loginMessage" class="login-message"></div>


                <button type="submit" class="login-button">

                    <span>تسجيل الدخول</span>

                </button>

            </form>


            <div class="login-footer">

                <span>ISP Assets Manager</span>

            </div>

        </section>

    </main>


    <script type="module" src="js/auth.js"></script><script type="module" src="js/auth.js"></script>


</body>

</html>
